name: Wild Pakistan CI & GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: TypeScript lint check
        run: npm run lint

      - name: Run simulation smoke tests (hunting, variety, swimming, arrests)
        run: npm test

      - name: Build static web export
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_FEEDBACK_SHEET_ID: ${{ secrets.VITE_FEEDBACK_SHEET_ID || vars.VITE_FEEDBACK_SHEET_ID }}
          VITE_SHEETS_WEBHOOK_URL: ${{ secrets.VITE_SHEETS_WEBHOOK_URL || vars.VITE_SHEETS_WEBHOOK_URL }}
        run: npm run build

      - name: Upload built dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: dist

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  screenshot-previews:
    needs: test-and-build
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web export
        uses: actions/download-artifact@v4
        with:
          name: web-export
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps

      - name: Capture landing & game screenshots
        run: |
          mkdir -p previews
          npx http-server dist -p 4173 --silent &
          SERVER_PID=$!
          sleep 2
          node -e "
            const { chromium } = require('playwright');
            (async () => {
              const browser = await chromium.launch({ args: ['--use-gl=angle', '--use-angle=swiftshader'] });
              const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
              await page.waitForTimeout(1200);
              await page.screenshot({ path: 'previews/landing-desktop.png' });
              await page.goto('http://127.0.0.1:4173/game/', { waitUntil: 'networkidle' });
              await page.waitForTimeout(800);
              await page.screenshot({ path: 'previews/game-setup-desktop.png' });
              await page.fill('#ranger-name', 'CI Ranger');
              await page.click('button[type=submit]');
              await page.waitForTimeout(1500);
              await page.screenshot({ path: 'previews/game-intro-desktop.png' });
              await page.click('text=Begin Run');
              await page.waitForTimeout(1500);
              await page.screenshot({ path: 'previews/game-active-desktop.png' });
              await browser.close();
            })();
          "
          kill $SERVER_PID || true

      - name: Upload screenshot previews artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-previews
          path: previews

      - name: Push screenshot previews to screenshots branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin screenshots || true
          git checkout -B screenshots
          git add -f previews/*.png
          git commit -m "chore: update CI screenshot previews [skip ci]" || exit 0
          git push -f origin screenshots

  deploy-pages:
    if: github.event_name == 'push'
    needs: [test-and-build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
